<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14970 3943" fill="none" role="img" aria-label="CreoScale">
  <title>CreoScale</title>
  <style>
    .logo-heart__shape,
    .logo-heart__detail { fill: #fd1645; }
    .logo-face__eye-white,
    .logo-face__pupil-glint,
    .logo-face__mouth-upper { fill: #fefefe; }
    .logo-face__pupil-dot { fill: #0f0f10; }
    .logo-face__mouth-inner { fill: #fd1645; }
    .logo-lockup__text { fill: currentColor; }
    .logo-face__eye-white {
      transform-box: fill-box;
      transform-origin: center;
      animation: logo-blink 5.2s ease-in-out infinite;
    }
    .logo-face__eye--right .logo-face__eye-white { animation-delay: 0.12s; }
    .logo-face__pupil {
      transform-box: fill-box;
      transform-origin: center;
      animation: logo-look 6.4s ease-in-out infinite;
    }
    .logo-face__eye--right .logo-face__pupil { animation-delay: 0.35s; }
    .logo-face__mouth {
      transform-box: fill-box;
      transform-origin: 50% 38%;
      opacity: 0;
      animation: logo-smile-appear 5.6s cubic-bezier(0.34, 1.2, 0.64, 1) infinite;
    }
    @keyframes logo-blink {
      0%, 44%, 46%, 100% { transform: scaleY(1); }
      45% { transform: scaleY(0.06); }
    }
    @keyframes logo-look {
      0%, 100% { transform: translate(0, 0); }
      28% { transform: translate(18px, 0); }
      52% { transform: translate(-12px, 8px); }
      76% { transform: translate(8px, -6px); }
    }
    @keyframes logo-smile-appear {
      0%, 14% {
        transform: scale(1, 0);
        opacity: 0;
      }
      22% {
        transform: scale(0.92, 0.35);
        opacity: 0.55;
      }
      30% {
        transform: scale(1.05, 1.1);
        opacity: 1;
      }
      38%, 72% {
        transform: scale(1);
        opacity: 1;
      }
      80% {
        transform: scale(1.04, 1.07);
        opacity: 1;
      }
      88%, 100% {
        transform: scale(1, 0);
        opacity: 0;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo-face__eye-white,
      .logo-face__pupil,
      .logo-face__mouth { animation: none; }
    }
  </style>
